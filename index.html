<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nova Music Premium</title>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
/* CORE STYLES */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --spotify-green:#1DB954; --bg-base:#000000; --c-elevated:#121212; --text-main:#ffffff; --text-sub:#b3b3b3; 
  --nav-height:65px; --radius-sm:6px; --ez-curve: cubic-bezier(0.3, 0, 0, 1); --sp-curve: cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
html,body{height:100%;overflow:hidden;background:var(--bg-base);color:var(--text-main);
  font-family: 'Circular', -apple-system, BlinkMacSystemFont, sans-serif; user-select: none;}
#app{display:flex;flex-direction:column;height:100vh;background:linear-gradient(180deg, rgba(30,30,30,1) 0%, rgba(0,0,0,1) 30%);}
#pages{flex:1;position:relative;overflow:hidden;}
.page{position:absolute;inset:0;overflow-y:auto;padding-bottom:calc(var(--nav-height) + 90px);
  opacity:0;pointer-events:none;transform:translateX(10px);transition:all 0.3s var(--ez-curve);scrollbar-width:none;}
.page::-webkit-scrollbar{display:none;}
.page.on{opacity:1;pointer-events:all;transform:none;}

/* HEADER & PILLS */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:48px 16px 16px;
  position:sticky;top:0;z-index:30;background:linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);}
.greet-h{font-size:22px;font-weight:700;}
.pills{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none;}
.pills::-webkit-scrollbar{display:none;}
.pill{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;
  background:rgba(255,255,255,0.1); color:var(--text-main); border:none;}
.pill.on{background:var(--spotify-green);color:#000;font-weight:600;}

/* LIST ITEMS */
.tlist{padding:0 16px;}
.titem{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;border-radius:var(--radius-sm);}
.titem-thumb{width:48px;height:48px;border-radius:4px;object-fit:cover;background:#282828;}
.titem-body{flex:1;min-width:0;}
.titem-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.titem-title.now{color:var(--spotify-green);}
.titem-artist{font-size:13px;color:var(--text-sub);margin-top:4px;}

/* MINI PLAYER */
.mplayer{position:fixed;bottom:calc(var(--nav-height) + 8px);left:8px;right:8px;background:var(--c-elevated);
  border-radius:var(--radius-sm);padding:8px;display:none;align-items:center;gap:10px;
  z-index:200;cursor:pointer;transform:translateY(150%);transition:transform 0.4s var(--sp-curve);}
.mplayer.on{display:flex;}
.mplayer.vis{transform:translateY(0);}
.mp-img{width:40px;height:40px;border-radius:4px;object-fit:cover;}
.mp-info{flex:1;min-width:0;}
.mp-title{font-size:13px;font-weight:700;}
.mp-artist{font-size:12px;color:var(--spotify-green);}
.mp-btn{background:none;border:none;color:#fff;}

/* FULL SCREEN PLAYER */
.fp{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;background:var(--c-elevated);
  transform:translateY(100%);transition:transform 0.4s var(--sp-curve);pointer-events:none;}
.fp.on{transform:translateY(0);pointer-events:all;}
.fp-bg{position:absolute;inset:0;background-size:cover;background-position:center;
  filter:blur(60px) brightness(0.4) saturate(1.5); transform:scale(1.2); z-index:0; transition:background-image 0.5s ease;}
.fp-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(18,18,18,1) 85%);z-index:1;}
.fp-wrap{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;height:100%;padding:48px 24px 24px;}
.fp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;}
.fp-topbtn{background:none;border:none;color:var(--text-main);}
.fp-art-wrap{width:100%;aspect-ratio:1/1;margin-bottom:40px;display:flex;align-items:center;justify-content:center;}
.fp-art-img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius-sm);box-shadow: 0 16px 40px rgba(0,0,0,0.6); transition:transform 0.3s ease;}
.fp-art-img.pau{transform:scale(0.85);}
.fp-meta{margin-bottom:24px;}
.fp-track-name{font-size:24px;font-weight:700;margin-bottom:4px;}
.fp-track-artist{font-size:16px;color:var(--text-sub);}
.fp-ctrl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.fpbtn{background:none;border:none;color:var(--text-main);}
.fp-playbig{width:72px;height:72px;border-radius:50%;background:var(--text-main);color:#000;border:none;display:flex;align-items:center;justify-content:center;}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-height);background:linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 100%);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100;}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:none;border:none;color:var(--text-sub);}
.nbtn span{font-size:10px;font-weight:500;}
.nbtn.on{color:var(--text-main);}

#yt{display:none;position:fixed;top:-9999px;width:1px;height:1px;}
</style>
</head>
<body>
<div id="app">
  <div id="pages">
    <!-- HOME PAGE -->
    <div class="page on" id="pg-home">
      <div class="hdr">
        <div class="greet-h" id="greetH">Selamat datang</div>
      </div>
      <div class="pills">
        <button class="pill on">Semua</button>
        <button class="pill">Musik</button>
      </div>
      <div class="tlist" id="home-list"></div>
    </div>
  </div>

  <!-- MINI PLAYER -->
  <div class="mplayer" id="mplayer" onclick="openFP()">
    <img class="mp-img" id="mpImg" src="" alt="">
    <div class="mp-info">
      <div class="mp-title" id="mpTit">-</div>
      <div class="mp-artist" id="mpArtist">-</div>
    </div>
    <button class="mp-btn" onclick="event.stopPropagation(); togglePlay()"><svg id="mpIco" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
  </div>

  <!-- FULL SCREEN PLAYER -->
  <div class="fp" id="fp">
    <div class="fp-bg" id="fpBg"></div>
    <div class="fp-overlay"></div>
    <div class="fp-wrap">
      <div class="fp-top">
        <button class="fp-topbtn" onclick="closeFP()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9l-7 7-7-7"/></svg></button>
        <span style="font-size:12px;font-weight:700;letter-spacing:1px;">Sekarang Diputar</span>
        <div style="width:24px"></div>
      </div>
      <div class="fp-art-wrap"><img class="fp-art-img pau" id="fpArt" src="" alt=""></div>
      <div class="fp-meta">
        <div class="fp-track-name" id="fpTrackName">-</div>
        <div class="fp-track-artist" id="fpTrackArtist">-</div>
      </div>
      <div class="fp-ctrl-row">
        <button class="fpbtn" onclick="prevTrack()"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="fp-playbig" onclick="togglePlay()"><svg id="fpIco" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="fpbtn" onclick="nextTrack()"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm10-12h2v12h-2z"/></svg></button>
      </div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav class="bnav">
    <button class="nbtn on"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></button>
    <button class="nbtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><span>Cari</span></button>
  </nav>

</div>
<div id="yt"></div>

<script>
// --- LOGIKA APLIKASI ---
let player, isPlaying = false, currentTrack = null;

const mockData = [
  {id: 'dQw4w9WgXcQ', title: 'Never Gonna Give You Up', artist: 'Rick Astley', thumb: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg'},
  {id: 'kJQP7kiw5Fk', title: 'Despacito', artist: 'Luis Fonsi', thumb: 'https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg'},
  {id: 'fJ9rUzIMcZQ', title: 'Bohemian Rhapsody', artist: 'Queen', thumb: 'https://img.youtube.com/vi/fJ9rUzIMcZQ/hqdefault.jpg'}
];

function initHome() {
  document.getElementById('home-list').innerHTML = mockData.map((t, i) => `
    <div class="titem" onclick="playTrack(${i})">
      <img class="titem-thumb" src="${t.thumb}">
      <div class="titem-body">
        <div class="titem-title" id="t-title-${i}">${t.title}</div>
        <div class="titem-artist">${t.artist}</div>
      </div>
    </div>
  `).join('');
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt', {
    height: '1', width: '1',
    playerVars: { autoplay: 1, controls: 0 },
    events: {
      onStateChange: (e) => {
        isPlaying = (e.data === YT.PlayerState.PLAYING);
        updateUI();
      }
    }
  });
}

function playTrack(index) {
  currentTrack = mockData[index];
  if(player && player.loadVideoById) player.loadVideoById(currentTrack.id);
  
  document.getElementById('mpTit').innerText = currentTrack.title;
  document.getElementById('mpArtist').innerText = currentTrack.artist;
  document.getElementById('mpImg').src = currentTrack.thumb;
  
  document.getElementById('fpTrackName').innerText = currentTrack.title;
  document.getElementById('fpTrackArtist').innerText = currentTrack.artist;
  document.getElementById('fpArt').src = currentTrack.thumb;
  document.getElementById('fpBg').style.backgroundImage = `url(${currentTrack.thumb})`;
  
  const mp = document.getElementById('mplayer');
  mp.classList.add('on');
  setTimeout(() => mp.classList.add('vis'), 10);
  
  document.querySelectorAll('.titem-title').forEach((el, i) => {
    el.classList.toggle('now', i === index);
  });
}

function togglePlay() {
  if(!player || !currentTrack) return;
  isPlaying ? player.pauseVideo() : player.playVideo();
}

function updateUI() {
  const PAUSE_SVG = '<rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>';
  const PLAY_SVG = '<path d="M8 5v14l11-7z" fill="currentColor"/>';
  
  document.getElementById('mpIco').innerHTML = isPlaying ? PAUSE_SVG : PLAY_SVG;
  document.getElementById('fpIco').innerHTML = isPlaying ? PAUSE_SVG : PLAY_SVG;
  
  const art = document.getElementById('fpArt');
  isPlaying ? art.classList.remove('pau') : art.classList.add('pau');
}

function openFP() { document.getElementById('fp').classList.add('on'); }
function closeFP() { document.getElementById('fp').classList.remove('on'); }

window.onload = () => {
  initHome();
  const h = new Date().getHours();
  document.getElementById('greetH').innerText = h < 12 ? 'Selamat Pagi' : h < 18 ? 'Selamat Sore' : 'Selamat Malam';
};
</script>
</body>
</html>
